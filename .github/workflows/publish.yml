name: Publish website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Publish future-dated posts after midnight UTC, even without a new commit.
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run lint
      - name: Test publishing and public artifact safeguards
        run: node --test tests/*.test.mjs
      - name: Install browser for responsive accessibility checks
        run: npx playwright install --with-deps chromium
      - name: Check responsive pages and navigation
        run: npm run test:e2e -- tests/portfolio.spec.js
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npm run package:site
      - name: Upload public website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
